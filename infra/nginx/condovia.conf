gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
gzip_min_length 1024;

# condovia.it + www → frontend
server {
    listen 80;
    server_name condovia.it www.condovia.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name condovia.it www.condovia.it;

    # Certbot inserirà qui i certificati SSL
    # ssl_certificate /etc/letsencrypt/live/condovia.it/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/condovia.it/privkey.pem;

    root /var/www/condovia;
    index index.html;

    # Service worker — no cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Manifest — no cache
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Assets statici — cache immutabile 1 anno
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React SPA — sempre serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# api.condovia.it → backend Node.js
server {
    listen 80;
    server_name api.condovia.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.condovia.it;

    # ssl_certificate /etc/letsencrypt/live/condovia.it/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/condovia.it/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
